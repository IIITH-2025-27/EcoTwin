services:

  # ── PostgreSQL + PostGIS + pgvector ────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
  
    container_name: ecotwin_postgres
  
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecotwin}
      POSTGRES_USER: ${POSTGRES_USER:-ecotwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  
    ports:
      - "5432:5432"
  
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
  
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-ecotwin} -d ${POSTGRES_DB:-ecotwin}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: ecotwin_redis
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      target: production
    container_name: ecotwin_backend
    env_file: .env
    environment:
      HYDROLAKES_SOURCE_PATH: ${HYDROLAKES_SOURCE_PATH:-/app/data/hydrolakes_india.geojson}
      HYDROLAKES_SHAPEFILE_PATH: ${HYDROLAKES_SHAPEFILE_PATH:-/app/app/HydroLAKES_polys_v10_shp/HydroLAKES_polys_v10_shp/HydroLAKES_polys_v10.shp}
    ports:
      - "8000:8000"
    volumes:
      - report_storage:/app/reports
      - prithvi_model:/app/models
      - hf_cache:/root/.cache/huggingface
      - sync_backups:/app/backups
      - ./data:/app/data:ro
      - ./app/HydroLAKES_polys_v10_shp:/app/app/HydroLAKES_polys_v10_shp:ro
      - ./app/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4
    container_name: ecotwin_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
      
volumes:
  postgres_data:
  redis_data:
  report_storage:
  sync_backups:
  prithvi_model:
  hf_cache:
